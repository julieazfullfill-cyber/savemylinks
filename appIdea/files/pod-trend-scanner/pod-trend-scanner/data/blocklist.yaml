registered_marks:
  # Khẩu hiệu đã biết là nhãn hiệu đã đăng ký — không phải danh từ chung.
  - Just Do It
  - Because You're Worth It
  - I'm Lovin' It
  - Got Milk

political:
  # Regex, không phải chuỗi thường (khác 5 nhóm trên) — check_blocklist() biết nhóm
  # này là pattern qua tên key "political", xem docstring pipeline/risk.py.
  - '\bmake\s+\w+\s+great\s+again\b'
  - '\b(vote|elect)\s+for\s+\w+\s+(20\d\d)\b'
  - '\b\w+\s+20(2[4-9]|3\d)\b' # "somename 2028" kiểu khẩu hiệu tranh cử theo năm
  - '\bre-?elect\s+\w+\b'
  - '\bdemocratic\s+party\b'
  - '\brepublican\s+party\b'
  - '\b(gop|maga)\b'
  - '\bimpeach\s+\w+\b'
  - '\b\w+\s+for\s+(president|congress|senate|governor)\b'
