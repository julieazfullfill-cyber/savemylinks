# Blocklist Lớp 1 — docs/RISK_POLICY.md. Rẻ, nhanh, chặn phần lớn trường hợp rõ ràng.
#
# Đây là bộ khởi động MINH HOẠ (illustrative), không đầy đủ — cần bổ sung liên tục khi
# gặp case mới trong production. Mỗi entry là một CỤM TỪ, so khớp dạng "word boundary,
# không phân biệt hoa thường" trên text đã chuẩn hoá (core/normalize.normalize), nghĩa
# là entry "star wars" bắt được "Star Wars", "STAR WARS mug", "star-wars tee"...
#
# `political` dùng REGEX PATTERN (không phải tên ứng viên cụ thể đang tại nhiệm) — an
# toàn hơn về mặt trung lập chính trị, và thực ra bắt tốt hơn với khẩu hiệu mới chưa
# từng thấy (xem docs/RISK_POLICY.md "Quy tắc riêng cho T3": khẩu hiệu vận động luôn
# bị chặn, "cũ hay mới").

