[project]
name = "pod-trend-scanner"
version = "0.1.0"
description = "Quét keyword POD đang lên, chấm điểm, lọc rủi ro IP, xuất design_brief"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.15",
    "pyyaml>=6.0",
    "apscheduler>=3.11",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Chỉ 2 adapter cần Playwright (pinterest_suggest devtools capture, pinterest_trends).
# Tách riêng vì kéo theo tải browser binary nặng, không cần cho phần còn lại của hệ thống.
browser = ["playwright>=1.49"]

[project.scripts]
scanner = "scanner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: cần Postgres chạy, bỏ qua nếu không kết nối được"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["scanner"]
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
