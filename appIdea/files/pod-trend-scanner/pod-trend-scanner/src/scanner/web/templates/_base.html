<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>{% block title %}POD Trend Scanner{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    body { font-family: monospace; margin: 2rem; max-width: 1100px; }
    nav { margin-bottom: 1.25rem; padding-bottom: .75rem; border-bottom: 2px solid #333; }
    nav a { margin-right: 1.25rem; color: #2563eb; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: right; }
    th, td:first-child { text-align: left; }
    tr:nth-child(even) { background: #f5f5f5; }
    a.row-link { color: inherit; text-decoration: none; }
    a.row-link:hover { text-decoration: underline; }
    .btn { display: inline-block; padding: 4px 10px; border: 1px solid #999; border-radius: 4px;
           background: #f8f8f8; cursor: pointer; font-family: inherit; font-size: .9em; }
    .btn:hover { background: #eee; }
    .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    .btn.danger { background: #dc2626; color: #fff; border-color: #dc2626; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    form.inline { display: inline-block; margin: 0 4px 0 0; }
    input[type=text] { font-family: inherit; padding: 3px 6px; }
    .result-box { border: 1px solid #ccc; border-radius: 4px; padding: 8px 12px; margin-top: 8px; font-size: .9em; }
    .result-box.pass, .result-box.low, .result-box.info { border-left: 5px solid #16a34a; }
    .result-box.review { border-left: 5px solid #d97706; }
    .result-box.block, .result-box.blocked { border-left: 5px solid #dc2626; }
    .htmx-indicator { display: none; margin-left: 6px; color: #888; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request.btn, .htmx-request .btn { opacity: .6; }
    .card { border: 1px solid #ccc; border-radius: 4px; padding: 12px 16px; margin-bottom: 12px; }
    .muted { color: #777; }
    .pos { color: #060; }
    .neg { color: #a00; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <a href="/">Trending hôm nay</a>
    <a href="/candidates">Momentum × Opportunity</a>
    <a href="/review">Hàng đợi duyệt</a>
    <a href="/seeds">Seeds</a>
    <a href="/uspto">USPTO index</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
